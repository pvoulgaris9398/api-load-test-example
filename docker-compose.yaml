name: api-load-test-example

services:
  db-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver2025
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
      - DOTNET_Metrics_Microsoft_Data_SqlClient=true
    ports:
      - "1433:1433"
    # Ensures the SQL engine is genuinely up and accepting queries before other services connect
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourSecurePassword123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5      

  api-service:
    container_name: csharp-api 
    build:
      context: ./csharp-api/.
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db-server

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      # Apparently this container expects the "prometheus.yml" not "yaml"
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=dude!      
    volumes:
      # Data source auto-configuration
      # Same for data source: "datasource.yml" not "yaml"
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      # Dashboard loader configuration
      # Same for data source: "provider.yml" not "yaml"
      - ./grafana/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      # The actual dashboard file schema
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
